* {
  box-sizing: border-box;
}

:root {
  --bg: #121212;
  --panel: #181818;
  --panel-soft: #1d1d1d;
  --ink: #f7f3ee;
  --muted: #d4cbbd;
  --line: rgba(255, 255, 255, 0.1);
  --gold: #caa96a;
  --gold-soft: #e3d1a0;
  --white: #f5f1ea;
  --shadow: 0 20px 40px rgba(0, 0, 0, 0.28);
  --radius: 18px;
}

html {
  scroll-behavior: smooth;
}

body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: 'Manrope', sans-serif;
  line-height: 1.6;
}

a {
  color: inherit;
  text-decoration: none;
}

img {
  display: block;
  width: 100%;
}

button, input, textarea, select {
  font: inherit;
}

button {
  cursor: pointer;
}

.container {
  width: min(1180px, calc(100% - 32px));
  margin: 0 auto;
}

.section-gap {
  padding: 96px 0;
}

.muted-section {
  background: rgba(255, 255, 255, 0.02);
  border-top: 1px solid var(--line);
  border-bottom: 1px solid var(--line);
}

.accent-section {
  background: linear-gradient(180deg, rgba(202, 169, 106, 0.08), rgba(18, 18, 18, 0));
}

.eyebrow {
  display: inline-block;
  font-size: 12px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--gold-soft);
  margin-bottom: 12px;
}

.site-header {
  position: sticky;
  top: 0;
  z-index: 100;
  background: rgba(18, 18, 18, 0.72);
  backdrop-filter: blur(18px);
  border-bottom: 1px solid var(--line);
}

.nav-shell {
  display: flex;
  align-items: center;
  justify-content: space-between;
  min-height: 84px;
  gap: 20px;
}

.brand {
  display: inline-flex;
  align-items: center;
  gap: 12px;
}

.brand-mark {
  display: grid;
  place-items: center;
  width: 40px;
  height: 40px;
  border-radius: 50%;
  background: rgba(202, 169, 106, 0.1);
  border: 1px solid rgba(202, 169, 106, 0.5);
  color: var(--gold-soft);
  font-family: 'Cormorant Garamond', serif;
  font-size: 28px;
  font-weight: 700;
}

.brand strong,
.brand small {
  display: block;
}

.brand strong {
  font-size: 0.9rem;
  letter-spacing: 0.08em;
  text-transform: uppercase;
}

.brand small {
  font-size: 0.7rem;
  color: var(--muted);
}

.main-nav {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 18px;
  flex-wrap: wrap;
}

.nav-link {
  color: var(--muted);
  font-size: 0.8rem;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  transition: color 0.2s ease;
}

.nav-link.active,
.nav-link:hover {
  color: var(--white);
}

.nav-actions {
  display: flex;
  align-items: center;
  gap: 12px;
}

.button {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  border-radius: 999px;
  min-height: 48px;
  padding: 0 24px;
  border: 1px solid transparent;
  font-weight: 700;
  transition: transform 0.2s ease, border 0.2s ease, background 0.2s ease;
}

.button:hover {
  transform: translateY(-1px);
}

.primary.button {
  background: var(--gold);
  color: #111;
  box-shadow: var(--shadow);
}

.secondary.button {
  border-color: rgba(202, 169, 106, 0.4);
  background: transparent;
  color: var(--white);
}

.hero {
  padding-top: 48px;
}

.hero-grid {
  display: grid;
  grid-template-columns: 1.15fr 1fr;
  align-items: center;
  gap: 46px;
}

.hero-copy h1,
.section-head h1,
.section-head h2,
.about-copy h2,
.legal-shell h1 {
  margin: 0 0 18px;
  font-family: 'Cormorant Garamond', serif;
  line-height: 0.92;
  font-weight: 600;
  letter-spacing: -0.02em;
}

.hero-copy h1 {
  font-size: clamp(3.5rem, 7vw, 6rem);
}

.hero-copy p {
  max-width: 620px;
  color: var(--muted);
  font-size: 1.08rem;
}

.button-row {
  display: flex;
  align-items: center;
  gap: 12px;
  flex-wrap: wrap;
  margin-top: 28px;
}

.hero-meta {
  display: flex;
  align-items: center;
  gap: 24px;
  margin-top: 28px;
  flex-wrap: wrap;
}

.hero-meta div {
  display: flex;
  flex-direction: column;
  gap: 3px;
}

.hero-meta strong {
  font-size: 1.2rem;
}

.hero-meta span {
  color: var(--muted);
  font-size: 0.82rem;
}

.hero-visual {
  position: relative;
  min-height: 620px;
}

.hero-photo-card {
  position: absolute;
  overflow: hidden;
  border-radius: 24px;
  border: 1px solid var(--line);
  box-shadow: var(--shadow);
  background: var(--panel);
}

.hero-photo-card img {
  height: 100%;
  object-fit: cover;
}

.hero-large {
  inset: 0 90px 0 0;
}

.hero-small {
  width: 210px;
  height: 260px;
  right: 0;
  overflow: hidden;
}

.hero-small.top {
  top: 18px;
}

.hero-small.bottom {
  bottom: 18px;
}

.intro-grid {
  display: grid;
  grid-template-columns: 1fr 1.2fr;
  gap: 40px;
  align-items: end;
}

.intro-grid h2,
.section-head h2,
.section-head h1 {
  font-size: clamp(2.4rem, 4vw, 3.5rem);
}

.intro-grid p,
.card-body p,
.about-copy p,
.legal-card p,
.package-card p,
.service-detail-card p,
.portfolio-info p,
.booking-note,
.contact-card p,
.contact-card a,
.admin-panel li {
  color: var(--muted);
}

.section-head {
  margin-bottom: 28px;
}

.card-grid {
  display: grid;
  gap: 24px;
}

.three-up {
  grid-template-columns: repeat(3, minmax(0, 1fr));
}

.service-card,
.package-card,
.portfolio-card,
.admin-panel,
.legal-card,
.booking-sidecard,
.contact-card {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  overflow: hidden;
}

.service-card img,
.service-detail-card img,
.about-image img {
  aspect-ratio: 4 / 3;
  object-fit: cover;
}

.card-body,
.package-card,
.portfolio-info,
.admin-panel,
.contact-card {
  padding: 22px;
}

.card-body h3,
.portfolio-info h3,
.package-card h2,
.service-detail-card h2,
.contact-card h3,
.admin-panel h3,
.cta-panel h2 {
  margin: 0 0 12px;
}

.meta-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-top: 18px;
  color: var(--gold-soft);
  font-weight: 700;
}

.collection-wrap {
  display: grid;
  gap: 26px;
}

.left {
  text-align: left;
}

.portfolio-strip {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 18px;
}

.mini-portfolio-item {
  display: grid;
  gap: 10px;
}

.mini-portfolio-item img {
  height: 260px;
  object-fit: cover;
  border-radius: 16px;
  border: 1px solid var(--line);
}

.mini-portfolio-item strong,
.mini-portfolio-item span {
  display: block;
}

.mini-portfolio-item span {
  color: var(--muted);
  font-size: 0.8rem;
}

.cta-panel {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 18px;
  background: linear-gradient(135deg, rgba(202, 169, 106, 0.12), rgba(255, 255, 255, 0.02));
  border: 1px solid var(--line);
  border-radius: 22px;
  padding: 30px 28px;
}

.cta-actions {
  display: flex;
  gap: 12px;
  flex-wrap: wrap;
}

.site-footer {
  border-top: 1px solid var(--line);
  background: #0f0f0f;
  padding: 36px 0 18px;
}

.footer-grid {
  display: grid;
  grid-template-columns: 1.2fr 1fr 1fr 1fr;
  gap: 30px;
}

.footer-grid h3,
.footer-grid h4 {
  margin-top: 0;
}

.footer-grid ul {
  list-style: none;
  margin: 0;
  padding: 0;
  display: grid;
  gap: 10px;
  color: var(--muted);
}

.footer-meta {
  display: flex;
  justify-content: space-between;
  gap: 16px;
  align-items: center;
  padding-top: 24px;
  margin-top: 20px;
  border-top: 1px solid var(--line);
  color: var(--muted);
  font-size: 0.85rem;
}

.floating-whatsapp {
  position: fixed;
  right: 22px;
  bottom: 22px;
  z-index: 120;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  padding: 16px 18px;
  border-radius: 999px;
  background: #25d366;
  color: #0d2015;
  font-weight: 800;
  box-shadow: var(--shadow);
}

.filter-bar {
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
  margin-bottom: 24px;
}

.filter-button {
  background: transparent;
  border: 1px solid var(--line);
  color: var(--muted);
  border-radius: 999px;
  padding: 10px 18px;
}

.filter-button.active {
  background: rgba(202, 169, 106, 0.12);
  border-color: rgba(202, 169, 106, 0.4);
  color: var(--white);
}

.portfolio-grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 22px;
}

.portfolio-card {
  display: grid;
  gap: 14px;
}

.portfolio-image-button {
  border: 0;
  padding: 0;
  background: transparent;
}

.portfolio-image-button img {
  height: 360px;
  object-fit: cover;
  border-radius: 18px;
  border: 1px solid var(--line);
}

.portfolio-info span {
  display: inline-block;
  color: var(--gold-soft);
  font-size: 0.76rem;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  margin-bottom: 8px;
}

.lightbox {
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.8);
  display: grid;
  place-items: center;
  z-index: 200;
  padding: 24px;
}

.lightbox-panel {
  position: relative;
  width: min(1100px, 100%);
  background: #111;
  border: 1px solid var(--line);
  border-radius: 24px;
  overflow: hidden;
}

.lightbox-panel img {
  max-height: 72vh;
  object-fit: contain;
  background: #000;
}

.lightbox-caption {
  display: flex;
  align-items: end;
  justify-content: space-between;
  gap: 18px;
  padding: 18px 20px 8px;
}

.lightbox-caption span {
  color: var(--gold-soft);
  text-transform: uppercase;
  letter-spacing: 0.1em;
  font-size: 0.72rem;
}

.lightbox-nav {
  display: flex;
  justify-content: space-between;
  gap: 12px;
  padding: 0 20px 20px;
}

.lightbox-nav button,
.close-lightbox {
  border: 1px solid var(--line);
  background: transparent;
  color: var(--white);
  min-height: 42px;
  padding: 0 16px;
  border-radius: 999px;
}

.close-lightbox {
  position: absolute;
  right: 18px;
  top: 18px;
  width: 42px;
  min-height: unset;
  padding: 0;
  font-size: 1.5rem;
}

.service-list {
  display: grid;
  gap: 24px;
}

.service-detail-card {
  display: grid;
  grid-template-columns: minmax(240px, 430px) 1fr;
  gap: 24px;
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  overflow: hidden;
}

.service-detail-card > div {
  padding: 28px 28px 28px 0;
}

.check-list,
.package-foot ul {
  list-style: none;
  padding: 0;
  margin: 18px 0 0;
  display: grid;
  gap: 8px;
}

.check-list li,
.package-foot li {
  position: relative;
  padding-left: 20px;
  color: var(--muted);
}

.check-list li::before,
.package-foot li::before {
  content: '•';
  position: absolute;
  left: 0;
  color: var(--gold-soft);
}

.package-card {
  display: grid;
  gap: 14px;
}

.price-tag {
  font-size: 2rem;
  font-weight: 800;
  color: var(--gold-soft);
}

.package-foot strong {
  display: block;
  margin-bottom: 8px;
}

.about-layout,
.contact-layout {
  display: grid;
  grid-template-columns: 1.1fr 0.9fr;
  gap: 24px;
  align-items: center;
}

.about-copy {
  display: grid;
  gap: 18px;
}

.highlight-list {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  margin-top: 8px;
}

.highlight-pill {
  display: inline-flex;
  align-items: center;
  min-height: 34px;
  border-radius: 999px;
  border: 1px solid rgba(202, 169, 106, 0.4);
  background: rgba(202, 169, 106, 0.08);
  padding: 0 14px;
  color: var(--white);
}

.booking-shell {
  display: grid;
  gap: 28px;
}

.booking-panel {
  display: grid;
  grid-template-columns: 1.2fr 0.8fr;
  gap: 24px;
}

.booking-form, .booking-sidecard, .contact-form-box, .admin-card, .legal-card {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 24px;
}

.field-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 18px;
}

label {
  display: grid;
  gap: 8px;
  color: var(--white);
}

.full-width {
  grid-column: 1 / -1;
}

input, textarea, select {
  width: 100%;
  border: 1px solid rgba(255, 255, 255, 0.1);
  border-radius: 12px;
  background: rgba(255, 255, 255, 0.02);
  color: var(--white);
  min-height: 48px;
  padding: 12px 14px;
}

textarea {
  resize: vertical;
}

small {
  color: #f2bfc1;
}

.checkbox-row {
  display: flex;
  align-items: flex-start;
  gap: 12px;
  margin-top: 18px;
}

.checkbox-row input {
  width: 18px;
  height: 18px;
  accent-color: var(--gold);
}

.booking-note,
.success-box {
  margin-top: 18px;
  border-radius: 12px;
  padding: 14px 16px;
  border: 1px solid rgba(202, 169, 106, 0.35);
  background: rgba(202, 169, 106, 0.08);
}

.success-box {
  color: #f4f0e8;
}

.submit-button {
  margin-top: 20px;
  width: 100%;
}

.booking-sidecard {
  display: grid;
  align-content: start;
  gap: 14px;
  min-height: 100%;
}

.contact-block {
  display: grid;
  gap: 8px;
  margin-top: 10px;
  color: var(--muted);
}

.contact-panel {
  display: grid;
  gap: 18px;
}

.map-panel iframe {
  width: 100%;
  height: 480px;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  background: #1a1a1a;
}

.contact-form-box {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  margin-top: 24px;
}

.social-links {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
}

.social-links a {
  color: var(--gold-soft);
}

.legal-shell {
  display: grid;
  gap: 20px;
}

.admin-login-shell {
  display: grid;
  place-items: center;
}

.admin-card {
  width: min(520px, 100%);
}

.admin-login-form {
  display: grid;
  gap: 18px;
  margin-top: 20px;
}

.stats-grid {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 18px;
  margin-bottom: 24px;
}

.stat-box {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 20px;
  display: grid;
  gap: 8px;
}

.stat-box strong {
  font-size: 2rem;
  color: var(--gold-soft);
}

.stat-box span {
  color: var(--muted);
}

.dashboard-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 24px;
}

.admin-panel ul {
  margin: 0;
  padding-left: 20px;
  display: grid;
  gap: 10px;
}

.empty-state {
  border: 1px dashed rgba(202, 169, 106, 0.4);
  background: rgba(202, 169, 106, 0.04);
  border-radius: var(--radius);
  padding: 28px;
  color: var(--muted);
}

@media (max-width: 980px) {
  .hero-grid,
  .intro-grid,
  .booking-panel,
  .contact-layout,
  .about-layout,
  .service-detail-card,
  .footer-grid,
  .dashboard-grid {
    grid-template-columns: 1fr;
  }

  .three-up,
  .portfolio-grid,
  .stats-grid,
  .portfolio-strip {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }

  .nav-shell {
    flex-wrap: wrap;
    padding: 18px 0;
  }

  .main-nav {
    order: 3;
    width: 100%;
    justify-content: center;
  }

  .nav-actions {
    margin-left: auto;
  }
}

@media (max-width: 640px) {
  .section-gap {
    padding: 72px 0;
  }

  .field-grid,
  .three-up,
  .portfolio-grid,
  .stats-grid,
  .portfolio-strip {
    grid-template-columns: 1fr;
  }

  .hero-copy h1 {
    font-size: 3.1rem;
  }

  .hero-visual {
    min-height: 440px;
  }

  .hero-large {
    inset: 0 0 90px 0;
  }

  .hero-small {
    width: 160px;
    height: 220px;
  }

  .cta-panel,
  .contact-form-box,
  .footer-meta,
  .lightbox-caption {
    flex-direction: column;
    align-items: flex-start;
  }
}
